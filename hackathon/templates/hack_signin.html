<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AscAIthon 2026 | Judge Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Segoe UI, sans-serif;
        }

        .login-card{
            width:420px;
            border:none;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.12);
        }

        .logo{
            width:70px;
            height:70px;
            border-radius:50%;
            background:#0d6efd;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
            font-weight:bold;
            margin:auto;
        }

        .btn-login{
            border-radius:10px;
            padding:10px;
            font-weight:600;
        }

        .form-control{
            height:48px;
            border-radius:10px;
        }
    </style>
</head>
<body>

<div class="card login-card p-4">

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}
    <div class="text-center mb-4">

        <div class="logo">
            A
        </div>

        <h3 class="mt-3 mb-1">AscAIthon 2026</h3>

        <p class="text-muted">
            Judge Evaluation Portal
        </p>

    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter username"
                required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required>
        </div>

        <button class="btn btn-primary w-100 btn-login">
            Sign In
        </button>

    </form>

</div>

</body>
</html>
